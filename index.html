
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Chnarok | Urban Planning Project</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #101c30,
        #243e60
      );
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      padding: 9px 16px;
      border: 1px solid #7891ad;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.2;
      margin: 0 0 18px;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      color: #c9d6e5;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      padding: 17px 35px;
      background: white;
      color: #14253d;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.2s;
    }

    .button:hover {
      background: #e2eaf4;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 45px;
      color: #aebfd2;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .button {
        width: 100%;
        max-width: 320px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="tag">
      URBAN PLANNING PROJECT
    </div>

    <h1>
      Chnarok Neighborhood
    </h1>

    <p>
      Sulaimani Polytechnic University
      <br>
      City Planning Engineering
      <br>
      Explore our urban planning project.
    </p>

    <a
      class="button"
      href="./chnarok.pdf"
      target="_blank"
      rel="noopener noreferrer">
      Our Project Detail
    </a>

    <div class="footer">
      Chnarok | Urban Planning Project
    </div>

  </main>

</body>
</html>
