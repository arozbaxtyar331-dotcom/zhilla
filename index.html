
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Chnarok | Urban Planning Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #14253d;
      --background: #eef1f5;
      --text: #1e293b;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(18px, 3vw, 26px);
      margin-bottom: 6px;
    }

    header p {
      font-size: 13px;
      opacity: 0.8;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: white;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button,
    .download {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 7px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    button:hover,
    .download:hover {
      background: #28466a;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .zoom-label {
      font-size: 14px;
      min-width: 55px;
      text-align: center;
    }

    .viewer {
      width: 100%;
      max-width: 1250px;
      margin: 0 auto;
      padding: 20px;
    }

    .pdf-page {
      background: white;
      margin: 0 auto 20px;
      width: 100%;
      overflow: hidden;
      border-radius: 5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .status {
      text-align: center;
      padding: 35px 15px;
      font-size: 15px;
    }

    .error {
      color: #b91c1c;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 10px;
      }

      header h1 {
        font-size: 18px;
      }

      .toolbar {
        gap: 7px;
        padding: 10px 5px;
      }

      button,
      .download {
        font-size: 12px;
        padding: 9px 11px;
      }

      .viewer {
        padding: 8px;
      }

      .pdf-page {
        margin-bottom: 12px;
        border-radius: 3px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Chnarok Urban Planning Project</h1>
    <p>Sulaimani Polytechnic University</p>
  </header>

  <div class="toolbar">
    <button id="zoomOut" disabled>
      − Zoom
    </button>

    <span class="zoom-label" id="zoomLevel">
      100%
    </span>

    <button id="zoomIn" disabled>
      + Zoom
    </button>

    <a class="download"
       href="./chnarok.pdf"
       download="Chnarok-Urban-Planning.pdf">
      Download PDF
    </a>
  </div>

  <main>
    <div id="status" class="status" role="status">
      Loading PDF...
    </div>

    <div id="pdfViewer"
         class="viewer"
         aria-label="Chnarok PDF document">
    </div>
  </main>

  <footer>
    Chnarok | Urban Planning Project
  </footer>

  <script type="module">
    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const PDF_URL = "./chnarok.pdf";

    const viewer = document.getElementById("pdfViewer");
    const status = document.getElementById("status");

    const zoomIn = document.getElementById("zoomIn");
    const zoomOut = document.getElementById("zoomOut");
    const zoomLevel = document.getElementById("zoomLevel");

    let pdfDocument = null;
    let zoom = 1;
    let renderVersion = 0;

    const MIN_ZOOM = 0.75;
    const MAX_ZOOM = 2;
    const ZOOM_STEP = 0.25;

    function updateControls() {
      zoomLevel.textContent =
        Math.round(zoom * 100) + "%";

      zoomIn.disabled =
        !pdfDocument || zoom >= MAX_ZOOM;

      zoomOut.disabled =
        !pdfDocument || zoom <= MIN_ZOOM;
    }

    async function renderPDF() {
      if (!pdfDocument) return;

      const version = ++renderVersion;

      viewer.replaceChildren();
      status.textContent = "Rendering pages...";
      status.hidden = false;

      try {
        for (
          let pageNumber = 1;
          pageNumber <= pdfDocument.numPages;
          pageNumber++
        ) {
          if (version !== renderVersion) return;

          const page = await pdfDocument.getPage(pageNumber);

          if (version !== renderVersion) return;

          const baseViewport = page.getViewport({
            scale: 1
          });

          const availableWidth =
            Math.max(1, viewer.clientWidth);

          const fitScale =
            availableWidth / baseViewport.width;

          const viewport = page.getViewport({
            scale: fitScale * zoom
          });

          const outputScale = Math.min(
            window.devicePixelRatio || 1,
            2
          );

          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          if (!context) {
            throw new Error("Canvas is not supported.");
          }

          canvas.width = Math.floor(
            viewport.width * outputScale
          );

          canvas.height = Math.floor(
            viewport.height * outputScale
          );

          canvas.style.width = "100%";
          canvas.style.height = "auto";

          const wrapper = document.createElement("div");
          wrapper.className = "pdf-page";
          wrapper.setAttribute(
            "aria-label",
            `Page ${pageNumber}`
          );

          wrapper.appendChild(canvas);
          viewer.appendChild(wrapper);

          await page.render({
            canvasContext: context,
            viewport,
            transform: [
              outputScale, 0, 0,
              outputScale, 0, 0
            ]
          }).promise;

          if (version !== renderVersion) return;
        }

        status.hidden = true;
      } catch (error) {
        if (version !== renderVersion) return;

        console.error("PDF rendering error:", error);

        status.textContent =
          "Unable to display the PDF. Please use the download button.";
        status.classList.add("error");
        status.hidden = false;
      }
    }

    let resizeTimer;

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(() => {
        if (pdfDocument) renderPDF();
      }, 250);
    });

    zoomIn.addEventListener("click", () => {
      zoom = Math.min(MAX_ZOOM, zoom + ZOOM_STEP);
      updateControls();
      renderPDF();
    });

    zoomOut.addEventListener("click", () => {
      zoom = Math.max(MIN_ZOOM, zoom - ZOOM_STEP);
      updateControls();
      renderPDF();
    });

    async function loadPDF() {
      try {
        pdfDocument = await pdfjsLib
          .getDocument(PDF_URL)
          .promise;

        updateControls();
        await renderPDF();
      } catch (error) {
        console.error("PDF loading error:", error);

        status.textContent =
          "Could not load the PDF. Please use the download button.";
        status.classList.add("error");
      }
    }

    loadPDF();
  </script>

</body>
</html>
